name: tests-expiration

on:
  pull_request:
    paths:
      - "expiration/**"
      - "common/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd expiration && npm install && npm run test:ci
