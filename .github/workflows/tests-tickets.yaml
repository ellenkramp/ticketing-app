name: tests-tickets

on:
  pull_request:
    paths:
      - "tickets/**"
      - "common/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install && npm run build:common && npm run typecheck -w tickets && npm run test:ci -w tickets
